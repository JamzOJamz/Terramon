name: Build mod

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JamzOJamz/build-tmodloader-mod@v1
        with:
          project: Terramon/Terramon.csproj
          dotnet-version: |
            8.0.x
            10.0.x
